[project]
name = "tokenfoundr-backend"
version = "0.1.0"
description = "TokenFounder - Agent Startup Ideation Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Run from backend/ directory:
#   PYTHONPATH=.. uv run pytest
# Or with the shortcut script:
#   cd backend && make test

